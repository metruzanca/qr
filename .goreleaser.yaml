# GoReleaser config for qr.
# Docs: https://goreleaser.com/customization/
version: 2

project_name: qr

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: qr
    main: .
    binary: qr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: qr
    formats: [tar.gz]
    # qr_1.2.3_Linux_x86_64.tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
  footer: |
    **Install with Go:**

    ```console
    go install github.com/metruzanca/qr@{{ .Tag }}
    ```
